name: s7c dispatch with input and run-name
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('S7C #{0}', inputs.number) || 'x' }}
on:
  workflow_dispatch:
    inputs:
      number:
        description: n
        required: true
permissions: {}
jobs:
  call:
    uses: eliorerz/ci-e2e-spike/.github/workflows/reusable2.yml@897ad9f40b1dd2931c16205d9890aa3922a84965
    permissions:
      actions: read
