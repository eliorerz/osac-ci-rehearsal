name: Probe target
run-name: "Probe target"
on:
  workflow_dispatch:
permissions: {}
jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  second:
    needs: [first]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "attempt ${{ github.run_attempt }}"
          sleep 45
          if [ "${{ github.run_attempt }}" = "1" ]; then exit 1; fi
