name: Probe listener
run-name: "listener action=${{ github.event.action }} attempt=${{ github.event.workflow_run.run_attempt }} status=${{ github.event.workflow_run.status }}"
on:
  workflow_run:
    workflows: ["Probe target"]
    types: [requested, in_progress, completed]
permissions: {}
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.action }} attempt ${{ github.event.workflow_run.run_attempt }}"
