---
# Throwaway probe (rehearsal only): does the pull request page draw a spinning check run that is attached to the check
# suite of a pull request run that is still in progress?
name: probe
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      sha:
        description: head commit
        required: true
      run_id:
        description: a pull_request workflow run on that commit that is still in progress
        required: true
permissions:
  checks: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          suite=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .check_suite_id)
          echo "attaching to check suite ${suite}"
          gh api -X POST "repos/${REPO}/check-runs" \
            -f name="probe / attached to a running suite" -f head_sha="${SHA}" -f status=in_progress \
            -F check_suite_id="${suite}" -f 'output[title]=Spinning?' -f 'output[summary]=probe' \
            --jq '"created \(.id) in suite \(.check_suite.id) app \(.app.slug)"'
          gh api -X POST "repos/${REPO}/check-runs" \
            -f name="probe / default suite" -f head_sha="${SHA}" -f status=in_progress \
            -f 'output[title]=Spinning?' -f 'output[summary]=probe' \
            --jq '"created \(.id) in suite \(.check_suite.id) app \(.app.slug)"'
