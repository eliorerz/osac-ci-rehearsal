---
# Throwaway probe (rehearsal only): does the pull request page draw a spinning check run that is attached to the check
# suite of a pull request run that is still in progress?
name: probe
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      sha:
        description: head commit
        required: true
      run_id:
        description: a pull_request workflow run on that commit that is still in progress
        required: true
permissions:
  checks: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mk() {
            gh api -X POST "repos/${REPO}/check-runs" -f head_sha="${SHA}" -f status=in_progress \
              -f 'output[title]=Spinning?' -f 'output[summary]=probe' "$@" \
              --jq '"created \(.id) \(.name) in suite \(.check_suite.id)"'
          }
          mk -f name="E2E / VMaaS"
          mk -f name="probe with external id" -f external_id="run:123"
          mk -f name="probe with details url" -f details_url="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          mk -f name="E2E"
